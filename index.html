<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#808080">
    <title>Racktility — Creativity Change The World</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --rack-gray: #808080; --rack-ink: #272727; --rack-paper: #f7f7f6; }
        body { min-height: 100vh; color: var(--rack-ink); background: var(--rack-paper); font-family: Inter, "Segoe UI", sans-serif; }
        .navbar { background: rgba(255,255,255,.9); }
        .brand-mark { width: 40px; height: 40px; color: white; background: var(--rack-gray); }
        .hero { min-height: calc(100vh - 73px); background: radial-gradient(circle at 80% 28%, #e5e5e3 0, transparent 30%), var(--rack-paper); }
        .eyebrow { color: #747474; letter-spacing: .14em; }
        .hero h1 { max-width: 680px; font-size: clamp(3rem, 7vw, 5.5rem); letter-spacing: -.065em; line-height: 1.02; }
        .hero-copy { max-width: 510px; color: #707070; font-size: 1.1rem; line-height: 1.8; }
        .btn-rack { color: #fff; background: var(--rack-gray); border-color: var(--rack-gray); }
        .btn-rack:hover { color: #fff; background: #696969; border-color: #696969; }
        .learning-card { max-width: 390px; border: 1px solid #ececeb; border-radius: 24px; box-shadow: 0 28px 80px rgba(30,30,30,.09); }
        .course-icon { width: 48px; height: 48px; background: #f0f0ef; color: #666; }
        .progress { height: 6px; }
        .progress-bar { background: var(--rack-gray); }
    </style>
</head>
<body>
    <h1>free robux</h1>
    <h1>testing</h1>
</body>
</html>
